<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PONG DAS 7 SOMBRAS — Online</title>
<style>
:root{--a:#5ee7ff;--b:#8a5cff;--bg:#050611;--panel:rgba(11,13,30,.78);--text:#f6f7ff;--muted:#8d93ae}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#151743 0,#070817 45%,#020309 100%);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--text)}button,input{font:inherit}button{cursor:pointer;border:0;color:var(--text)}.app{width:100%;height:100%;position:relative;isolation:isolate}.stars{position:absolute;inset:0;opacity:.45;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#6ee7ff 1px,transparent 1px);background-size:83px 83px,137px 137px;background-position:15px 24px,40px 70px;animation:drift 24s linear infinite;z-index:-1}@keyframes drift{to{background-position:100px 100px,0 0}}.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px}.screen.active{display:flex}.menu{width:min(920px,94vw);text-align:center}.brand{font-weight:1000;font-size:clamp(56px,11vw,124px);letter-spacing:.08em;line-height:.82;text-shadow:0 0 20px #5ee7ff66,0 0 70px #8a5cff55}.brand small{display:block;font-size:clamp(12px,1.8vw,20px);letter-spacing:.55em;color:var(--a);margin:20px 0 36px}.tag{color:var(--muted);margin:-18px 0 32px}.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.btn{min-width:180px;padding:15px 22px;border-radius:14px;background:linear-gradient(135deg,#1b2340,#11142b);border:1px solid #ffffff16;box-shadow:0 10px 35px #0007;transition:.18s}.btn:hover{transform:translateY(-2px);border-color:#5ee7ff88;box-shadow:0 0 25px #5ee7ff22}.btn.primary{background:linear-gradient(135deg,var(--a),#6677ff);color:#03040b;font-weight:900}.btn.online{background:linear-gradient(135deg,#7b5cff,#c05cff);font-weight:900}.panel{width:min(650px,94vw);padding:28px;border-radius:24px;background:var(--panel);backdrop-filter:blur(18px);border:1px solid #ffffff16;box-shadow:0 25px 80px #0008}.panel h2{margin:0 0 22px;font-size:28px}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid #ffffff0d}.row:last-child{border:0}.row label{color:#dfe2f2}.select,.range{accent-color:var(--a);background:#11152a;color:white;border:1px solid #ffffff18;border-radius:10px;padding:9px}.lobby{text-align:center}.loader{width:58px;height:58px;border:4px solid #ffffff12;border-top-color:var(--a);border-right-color:var(--b);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 22px}@keyframes spin{to{transform:rotate(360deg)}}.status{font-weight:800;color:var(--a);margin:8px}.server{font-size:12px;color:#737995;margin-top:18px;word-break:break-all}.game{position:absolute;inset:0;padding:12px;display:none;flex-direction:column}.game.active{display:flex}.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}.score{font-size:clamp(30px,5vw,64px);font-weight:1000;letter-spacing:.08em;text-shadow:0 0 18px #5ee7ff55}.badge{padding:7px 12px;border-radius:999px;background:#ffffff0b;border:1px solid #ffffff12;color:#aab1cc;font-size:12px}.canvas-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.canvas-wrap canvas{width:100%;height:100%;display:block;border-radius:18px;box-shadow:inset 0 0 80px #000,0 0 60px #0009}.gamebar{display:flex;justify-content:center;gap:10px;padding:10px}.icon{padding:10px 14px;border-radius:10px;background:#ffffff0b;border:1px solid #ffffff10}.skin-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.skin{height:70px;border-radius:12px;border:2px solid transparent;background:#15192e}.skin.selected{border-color:var(--a);box-shadow:0 0 20px #5ee7ff33}.dot{width:24px;height:24px;border-radius:50%;margin:0 auto 6px}.help{font-size:12px;color:var(--muted);line-height:1.6}.hidden{display:none!important}@media(max-width:600px){.btn{min-width:145px}.panel{padding:20px}.skin-grid{grid-template-columns:repeat(3,1fr)}.game{padding:7px}}
</style></head>
<body><div class="app"><div class="stars"></div>
<section id="home" class="screen active"><div class="menu"><div class="brand">PONG DAS 7 SOMBRAS<small>ANTI-LAG • ONLINE</small></div><p class="tag">Velocidade. Precisão. Duelo online.</p><div class="buttons"><button class="btn primary" id="play">JOGAR</button><button class="btn online" id="online">MULTIPLAYER ONLINE</button><button class="btn" id="options">OPÇÕES</button><button class="btn" id="skins">SKINS</button></div><div class="server">Servidor multiplayer: https://pongdas7sombras.onrender.com</div></div></section>
<section id="opts" class="screen"><div class="panel"><h2>⚙ OPÇÕES</h2><div class="row"><label>Modo local</label><select id="mode" class="select"><option value="cpu">1 jogador vs CPU</option><option value="local">2 jogadores</option></select></div><div class="row"><label>Velocidade</label><input id="speed" class="range" type="range" min="5" max="15" value="9"></div><div class="row"><label>Nome online</label><input id="name" class="select" maxlength="16" placeholder="Jogador"></div><div class="buttons"><button class="btn primary" id="saveOpts">SALVAR</button><button class="btn" data-back>VOLTAR</button></div></div></section>
<section id="skinScreen" class="screen"><div class="panel"><h2>🎨 SKINS</h2><div id="skinGrid" class="skin-grid"></div><div class="buttons" style="margin-top:20px"><button class="btn" data-back>VOLTAR</button></div></div></section>
<section id="lobby" class="screen"><div class="panel lobby"><div class="loader"></div><h2>PROCURANDO ADVERSÁRIO</h2><div id="lobbyStatus" class="status">Conectando...</div><p class="help">O servidor vai colocar você em uma sala automaticamente.</p><div class="buttons"><button class="btn" id="cancelLobby">CANCELAR</button></div></div></section>
<section id="game" class="game"><div class="hud"><div class="badge" id="conn">● OFFLINE</div><div class="score"><span id="p1">0</span> : <span id="p2">0</span></div><div class="badge" id="role">LOCAL</div></div><div class="canvas-wrap"><canvas id="c"></canvas></div><div class="gamebar"><button class="icon" id="pause">⏸</button><button class="icon" id="leave">✕ Sair</button></div></section>
</div>
<script>
const SERVER='https://pongdas7sombras.onrender.com', WS=SERVER.replace(/^http/,'ws');
const screens={home:document.querySelector('#home'),opts:document.querySelector('#opts'),skinScreen:document.querySelector('#skinScreen'),lobby:document.querySelector('#lobby'),game:document.querySelector('#game')};
function show(k){Object.values(screens).forEach(x=>x.classList.remove('active'));screens[k].classList.add('active')}
let skin=localStorage.getItem('pongdas7sombras-skin')||'neon', mode=localStorage.getItem('pongdas7sombras-mode')||'cpu'; document.querySelector('#mode').value=mode;
const skins={classic:['#fff','#9aa0b4'],neon:['#5ee7ff','#b45cff'],ice:['#dff8ff','#62b7ff'],fire:['#fff','#ff5b32'],matrix:['#eaffea','#29e65c']};
function renderSkins(){skinGrid.innerHTML=Object.entries(skins).map(([n,c])=>`<button class="skin ${n===skin?'selected':''}" data-skin="${n}"><div class="dot" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></div>${n.toUpperCase()}</button>`).join('')}
renderSkins();skinGrid.onclick=e=>{let b=e.target.closest('[data-skin]');if(!b)return;skin=b.dataset.skin;localStorage.setItem('pongdas7sombras-skin',skin);renderSkins()};
options.onclick=()=>show('opts');skins.onclick=()=>show('skinScreen');document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('home'));saveOpts.onclick=()=>{mode=document.querySelector('#mode').value;localStorage.setItem('pongdas7sombras-mode',mode);show('home')};
play.onclick=()=>{startLocal();requestFS()};online.onclick=()=>{show('lobby');connectOnline();requestFS()};cancelLobby.onclick=()=>{closeSocket();show('home')};leave.onclick=()=>{closeSocket();stopGame();show('home')};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'▶':'⏸'};
function requestFS(){document.documentElement.requestFullscreen?.().catch(()=>{})}
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');let raf,last=0,paused=false,local=false,socket=null,player=1,remoteState=null,keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Escape'){if(screens.game.classList.contains('active')){stopGame();closeSocket();show('home')}}if(e.key==='p'&&!e.repeat)paused=!paused});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);
let W=900,H=500,g={x:450,y:250,vx:420,vy:230,p1:210,p2:210,s1:0,s2:0};
function resetBall(dir=(Math.random()>.5?1:-1)){g.x=450;g.y=250;g.vx=dir*420;g.vy=(Math.random()-.5)*300}
function startLocal(){local=true;player=1;g={x:450,y:250,vx:420,vy:230,p1:210,p2:210,s1:0,s2:0};document.querySelector('#role').textContent=mode==='cpu'?'CPU':'LOCAL';document.querySelector('#conn').textContent='● LOCAL';show('game');resize();stopLoop();last=performance.now();raf=requestAnimationFrame(loop)}
function stopGame(){cancelAnimationFrame(raf);local=false}
function stopLoop(){cancelAnimationFrame(raf)}
function loop(t){raf=requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.033);last=t;if(!paused){if(local)updateLocal(dt);else if(remoteState)g=remoteState;draw()}}
function updateLocal(dt){let s=+speed.value*38;let up=keys.w||keys.arrowup,down=keys.s||keys.arrowdown;g.p1+=((down?1:0)-(up?1:0))*s*dt;if(mode==='local'){let u=keys.i||keys.arrowup,d=keys.k||keys.arrowdown;g.p2+=((d?1:0)-(u?1:0))*s*dt}else{let target=g.y;g.p2+=(target-g.p2)*Math.min(1,dt*5)}g.p1=Math.max(55,Math.min(H-55,g.p1));g.p2=Math.max(55,Math.min(H-55,g.p2));g.x+=g.vx*dt;g.y+=g.vy*dt;if(g.y<12||g.y>H-12)g.vy*=-1;if(g.x<44&&Math.abs(g.y-g.p1)<62){g.x=44;g.vx=Math.abs(g.vx)*1.03;g.vy+=(g.y-g.p1)*4}if(g.x>856&&Math.abs(g.y-g.p2)<62){g.x=856;g.vx=-Math.abs(g.vx)*1.03;g.vy+=(g.y-g.p2)*4}if(g.x<0){g.s2++;resetBall(1)}if(g.x>900){g.s1++;resetBall(-1)}p1.textContent=g.s1;p2.textContent=g.s2}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,sx=w/W,sy=h/H;ctx.save();ctx.clearRect(0,0,w,h);ctx.scale(sx,sy);let [a,b]=skins[skin];let grd=ctx.createRadialGradient(450,250,30,450,250,520);grd.addColorStop(0,'#14183b');grd.addColorStop(1,'#050611');ctx.fillStyle=grd;ctx.fillRect(0,0,900,500);ctx.setLineDash([12,18]);ctx.strokeStyle='#ffffff12';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(450,15);ctx.lineTo(450,485);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=22;ctx.shadowColor=a;ctx.fillStyle=a;round(26,g.p1-60,12,120,6);ctx.shadowColor=b;ctx.fillStyle=b;round(862,g.p2-60,12,120,6);ctx.shadowBlur=35;ctx.shadowColor=a;ctx.fillStyle=a;ctx.beginPath();ctx.arc(g.x,g.y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function connectOnline(){closeSocket();try{socket=new WebSocket(WS);socket.onopen=()=>{conn.textContent='● CONECTADO';lobbyStatus.textContent='Conectado. Aguardando jogador 2...';socket.send(JSON.stringify({type:'queue',name:document.querySelector('#name').value.trim()||'Jogador',skin}))};socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='matched'){player=m.player;local=false;paused=false;document.querySelector('#role').textContent='ONLINE • P'+player;show('game');resize();stopLoop();last=performance.now();raf=requestAnimationFrame(loop)}else if(m.type==='state'){remoteState=m.state;p1.textContent=m.state.s1;p2.textContent=m.state.s2}else if(m.type==='status'){lobbyStatus.textContent=m.message}};socket.onclose=()=>{conn.textContent='● DESCONECTADO';if(screens.game.classList.contains('active')){stopGame();show('home')}};socket.onerror=()=>{lobbyStatus.textContent='Não foi possível conectar ao servidor.'}}catch(e){lobbyStatus.textContent='Erro de conexão.'}}
function closeSocket(){if(socket){try{socket.close()}catch{}socket=null}}
setInterval(()=>{if(socket?.readyState===1&&screens.game.classList.contains('active'))socket.send(JSON.stringify({type:'input',up:player===1?!!keys.w||!!keys.arrowup:!!keys.i,down:player===1?!!keys.s||!!keys.arrowdown:!!keys.k}))},33);
</script></body></html>
