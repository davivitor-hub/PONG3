<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PONG DAS 7 SOMBRAS — Online</title>
<style>
:root{--bg:#101114;--panel:#191b20;--line:#30333b;--text:#f3f4f6;--muted:#a1a1aa;--accent:#b8f36b;--accentText:#10140b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;position:relative}.stars{display:none}.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}.screen.active{display:flex}.menu{width:min(640px,100%);text-align:center}.brand{font-size:clamp(34px,7vw,68px);font-weight:850;letter-spacing:-.05em;line-height:1.05}.brand small{display:block;font-size:12px;letter-spacing:.22em;color:var(--accent);margin:14px 0 20px}.tag{color:var(--muted);margin:0 0 28px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{min-width:150px;padding:12px 17px;border-radius:8px;background:#252830;border:1px solid var(--line);transition:background .15s}.btn:hover{background:#30343d}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentText);font-weight:750}.btn.online{background:#252830;border-color:#50545e;font-weight:700}.panel{width:min(560px,100%);padding:24px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}.panel h2{margin:0 0 18px;font-size:24px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row label{color:#e4e4e7}.select,.range{max-width:60%;accent-color:var(--accent);background:#101114;color:var(--text);border:1px solid #41444d;border-radius:7px;padding:8px}.lobby{text-align:center}.loader{width:34px;height:34px;border:3px solid #3b3e46;border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}.status{font-weight:700;color:var(--accent);margin:8px}.server{font-size:12px;color:var(--muted);margin-top:22px;word-break:break-all}.game{position:fixed;inset:0;padding:12px;display:none;flex-direction:column;gap:8px}.game.active{display:flex}.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}.score{font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:.04em}.badge{padding:6px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px}.canvas-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.canvas-wrap canvas{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:8px}.gamebar{display:flex;justify-content:center;gap:8px;padding:4px}.icon{padding:9px 14px;border-radius:7px;background:var(--panel);border:1px solid var(--line)}.icon:hover{background:#292c33}.skin-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.skin{height:64px;border-radius:8px;border:1px solid var(--line);background:#22252b}.skin.selected{border:2px solid var(--accent)}.dot{width:20px;height:20px;border-radius:50%;margin:0 auto 5px}.help{font-size:13px;color:var(--muted);line-height:1.6}.hidden{display:none!important}@media(max-width:600px){.btn{min-width:130px}.panel{padding:18px}.skin-grid{grid-template-columns:repeat(3,1fr)}.game{padding:6px}.badge{font-size:10px;padding:5px 7px}}
</style></head>
<body><div class="app">
<section id="home" class="screen active"><div class="menu"><div class="brand">PONG DAS 7 SOMBRAS<small>PONG ONLINE</small></div><p class="tag">Jogue localmente ou desafie alguém online.</p><div class="buttons"><button class="btn primary" id="play">JOGAR</button><button class="btn online" id="online">MULTIPLAYER ONLINE</button><button class="btn" id="options">OPÇÕES</button><button class="btn" id="skins">SKINS</button></div><div class="server">Servidor multiplayer: https://pong3.onrender.com</div></div></section>
<section id="opts" class="screen"><div class="panel"><h2>⚙ OPÇÕES</h2><div class="row"><label>Modo local</label><select id="mode" class="select"><option value="cpu">1 jogador vs CPU</option><option value="local">2 jogadores</option></select></div><div class="row"><label>Velocidade</label><input id="speed" class="range" type="range" min="5" max="15" value="9"></div><div class="row"><label>Nome online</label><input id="name" class="select" maxlength="16" placeholder="Jogador"></div><div class="buttons"><button class="btn primary" id="saveOpts">SALVAR</button><button class="btn" data-back>VOLTAR</button></div></div></section>
<section id="skinScreen" class="screen"><div class="panel"><h2>🎨 SKINS</h2><div id="skinGrid" class="skin-grid"></div><div class="buttons" style="margin-top:20px"><button class="btn" data-back>VOLTAR</button></div></div></section>
<section id="lobby" class="screen"><div class="panel lobby"><div class="loader"></div><h2>PROCURANDO ADVERSÁRIO</h2><div id="lobbyStatus" class="status">Conectando...</div><p class="help">O servidor vai colocar você em uma sala automaticamente.</p><div class="buttons"><button class="btn" id="cancelLobby">CANCELAR</button></div></div></section>
<section id="game" class="game"><div class="hud"><div class="badge" id="conn">● OFFLINE</div><div class="score"><span id="p1">0</span> : <span id="p2">0</span></div><div class="badge" id="role">LOCAL</div></div><div class="canvas-wrap"><canvas id="c"></canvas></div><div class="gamebar"><button class="icon" id="pause">⏸</button><button class="icon" id="leave">✕ Sair</button></div></section>
</div>
<script>
const SERVER='https://pong3.onrender.com', WS='wss://pong3.onrender.com';
const screens={home:document.querySelector('#home'),opts:document.querySelector('#opts'),skinScreen:document.querySelector('#skinScreen'),lobby:document.querySelector('#lobby'),game:document.querySelector('#game')};
function show(k){Object.values(screens).forEach(x=>x.classList.remove('active'));screens[k].classList.add('active')}
let skin=localStorage.getItem('pongdas7sombras-skin')||'neon', mode=localStorage.getItem('pongdas7sombras-mode')||'cpu'; document.querySelector('#mode').value=mode;
const skins={classic:['#fff','#9aa0b4'],neon:['#5ee7ff','#b45cff'],ice:['#dff8ff','#62b7ff'],fire:['#fff','#ff5b32'],matrix:['#eaffea','#29e65c']};
function renderSkins(){skinGrid.innerHTML=Object.entries(skins).map(([n,c])=>`<button class="skin ${n===skin?'selected':''}" data-skin="${n}"><div class="dot" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></div>${n.toUpperCase()}</button>`).join('')}
renderSkins();skinGrid.onclick=e=>{let b=e.target.closest('[data-skin]');if(!b)return;skin=b.dataset.skin;localStorage.setItem('pongdas7sombras-skin',skin);renderSkins()};
options.onclick=()=>show('opts');skins.onclick=()=>show('skinScreen');document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('home'));saveOpts.onclick=()=>{mode=document.querySelector('#mode').value;localStorage.setItem('pongdas7sombras-mode',mode);show('home')};
play.onclick=()=>{startLocal()};online.onclick=()=>{show('lobby');connectOnline(true)};cancelLobby.onclick=()=>{closeSocket(true);show('home')};leave.onclick=()=>{closeSocket(true);stopGame();show('home')};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'▶':'⏸'};
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');let raf,last=0,paused=false,local=false,socket=null,player=1,remoteState=null,keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Escape'){if(screens.game.classList.contains('active')){stopGame();closeSocket();show('home')}}if(e.key==='p'&&!e.repeat)paused=!paused});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);
let W=900,H=500,g={x:450,y:250,vx:420,vy:230,p1:210,p2:210,s1:0,s2:0};
function resetBall(dir=(Math.random()>.5?1:-1)){g.x=450;g.y=250;g.vx=dir*420;g.vy=(Math.random()-.5)*300}
function startLocal(){local=true;player=1;g={x:450,y:250,vx:420,vy:230,p1:210,p2:210,s1:0,s2:0};document.querySelector('#role').textContent=mode==='cpu'?'CPU':'LOCAL';document.querySelector('#conn').textContent='● LOCAL';show('game');resize();stopLoop();last=performance.now();raf=requestAnimationFrame(loop)}
function stopGame(){cancelAnimationFrame(raf);local=false}
function stopLoop(){cancelAnimationFrame(raf)}
function loop(t){raf=requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.033);last=t;if(!paused){if(local)updateLocal(dt);else if(remoteState)g=remoteState;draw()}}
function updateLocal(dt){let s=+speed.value*38;let up=keys.w||keys.arrowup,down=keys.s||keys.arrowdown;g.p1+=((down?1:0)-(up?1:0))*s*dt;if(mode==='local'){let u=keys.i||keys.arrowup,d=keys.k||keys.arrowdown;g.p2+=((d?1:0)-(u?1:0))*s*dt}else{let target=g.y;g.p2+=(target-g.p2)*Math.min(1,dt*5)}g.p1=Math.max(55,Math.min(H-55,g.p1));g.p2=Math.max(55,Math.min(H-55,g.p2));g.x+=g.vx*dt;g.y+=g.vy*dt;if(g.y<12||g.y>H-12)g.vy*=-1;if(g.x<44&&Math.abs(g.y-g.p1)<62){g.x=44;g.vx=Math.abs(g.vx)*1.03;g.vy+=(g.y-g.p1)*4}if(g.x>856&&Math.abs(g.y-g.p2)<62){g.x=856;g.vx=-Math.abs(g.vx)*1.03;g.vy+=(g.y-g.p2)*4}if(g.x<0){g.s2++;resetBall(1)}if(g.x>900){g.s1++;resetBall(-1)}p1.textContent=g.s1;p2.textContent=g.s2}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,sx=w/W,sy=h/H;ctx.save();ctx.clearRect(0,0,w,h);ctx.scale(sx,sy);let [a,b]=skins[skin];let grd=ctx.createRadialGradient(450,250,30,450,250,520);grd.addColorStop(0,'#14183b');grd.addColorStop(1,'#050611');ctx.fillStyle=grd;ctx.fillRect(0,0,900,500);ctx.setLineDash([12,18]);ctx.strokeStyle='#ffffff12';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(450,15);ctx.lineTo(450,485);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=22;ctx.shadowColor=a;ctx.fillStyle=a;round(26,g.p1-60,12,120,6);ctx.shadowColor=b;ctx.fillStyle=b;round(862,g.p2-60,12,120,6);ctx.shadowBlur=35;ctx.shadowColor=a;ctx.fillStyle=a;ctx.beginPath();ctx.arc(g.x,g.y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
let reconnectTimer=null,reconnectAttempts=0,manualClose=false,onlineWanted=false;
function setConnection(text){conn.textContent=text}
function connectOnline(isFresh=false){
  onlineWanted=true; manualClose=false;
  if(isFresh){reconnectAttempts=0;clearTimeout(reconnectTimer)}
  closeSocket(false);
  lobbyStatus.textContent=reconnectAttempts?'Reconectando ao servidor...':'Conectando ao servidor...';
  setConnection('● CONECTANDO');
  try{
    socket=new WebSocket(WS);
    socket.onopen=()=>{
      reconnectAttempts=0;
      setConnection('● ONLINE');
      lobbyStatus.textContent='Conectado. Aguardando jogador 2...';
      socket.send(JSON.stringify({type:'queue',name:document.querySelector('#name').value.trim()||'Jogador',skin}));
    };
    socket.onmessage=e=>{
      let m; try{m=JSON.parse(e.data)}catch{return}
      if(m.type==='matched'){
        player=m.player;local=false;paused=false;remoteState=null;
        document.querySelector('#role').textContent='ONLINE • P'+player;
        show('game');resize();stopLoop();last=performance.now();raf=requestAnimationFrame(loop);
      }else if(m.type==='state'){
        remoteState=m.state;p1.textContent=m.state.s1;p2.textContent=m.state.s2;
      }else if(m.type==='status'){
        lobbyStatus.textContent=m.message;
      }
    };
    socket.onerror=()=>{setConnection('● ERRO');lobbyStatus.textContent='Falha de conexão. Tentando novamente...';try{socket.close()}catch{}};
    socket.onclose=()=>{
      socket=null;
      setConnection('● DESCONECTADO');
      if(!onlineWanted||manualClose)return;
      reconnectAttempts++;
      const wait=Math.min(15000,1000*Math.pow(1.5,Math.min(reconnectAttempts,8)));
      lobbyStatus.textContent='Conexão perdida. Reconectando automaticamente...';
      if(screens.game.classList.contains('active')){stopGame();show('lobby')}
      clearTimeout(reconnectTimer);
      reconnectTimer=setTimeout(()=>connectOnline(false),wait);
    };
  }catch(e){
    setConnection('● ERRO');
    if(onlineWanted&&!manualClose){reconnectAttempts++;clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>connectOnline(false),Math.min(15000,1000*reconnectAttempts))}
  }
}
function closeSocket(permanent=true){if(permanent){onlineWanted=false;manualClose=true;clearTimeout(reconnectTimer);reconnectTimer=null}if(socket){try{socket.close()}catch{}socket=null}}
setInterval(()=>{if(socket?.readyState===1&&screens.game.classList.contains('active'))socket.send(JSON.stringify({type:'input',up:player===1?!!keys.w||!!keys.arrowup:!!keys.i,down:player===1?!!keys.s||!!keys.arrowdown:!!keys.k}))},33);
</script></body></html>
