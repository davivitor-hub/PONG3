<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong das 7 Sombras - Multiplayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="canvas-container" id="canvasContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Painel Overlay de Multiplayer -->
    <div id="multiplayerUI" class="multiplayer-ui hidden">
        
        <!-- Tela: Criar Sala -->
        <div id="cardCreateRoom" class="ui-card hidden">
            <h2>CRIAR SALA MULTIPLAYER</h2>
            <div class="form-group">
                <label for="inputCustomCode">Código da Sala (Opcional - ex: SOMBRA):</label>
                <input type="text" id="inputCustomCode" maxlength="8" placeholder="Auto-gerado se vazio" uppercase>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="checkIsPublic" checked>
                <label for="checkIsPublic">Tornar Sala Pública (Visível no Lobby)</label>
            </div>
            <div class="btn-group">
                <button id="btnConfirmCreate" class="glow-btn">Criar Sala</button>
                <button id="btnBackFromCreate" class="glow-btn cancel-btn">Voltar</button>
            </div>
        </div>

        <!-- Tela: Aguardando Oponente -->
        <div id="cardWaitingRoom" class="ui-card hidden">
            <h2 id="uiRoomTitle">SALA CRIADA</h2>
            <div class="code-box" id="uiRoomCode">000000</div>
            <p class="status-text" id="uiStatusText">Aguardando o Jogador 2 conectar...</p>
            <div class="btn-group">
                <button id="btnCopyCode" class="glow-btn">Copiar Código</button>
                <button id="btnCopyLink" class="glow-btn">Copiar Link Directo</button>
            </div>
            <button id="btnCancelRoom" class="glow-btn cancel-btn">Sair da Sala</button>
        </div>

        <!-- Tela: Entrar em Sala / Salas Públicas -->
        <div id="cardJoinRoom" class="ui-card hidden">
            <h2>LOBBY MULTIPLAYER</h2>
            
            <div class="section-box">
                <h3>ENTRAR COM CÓDIGO PRIVADO</h3>
                <div class="inline-form">
                    <input type="text" id="inputJoinCode" maxlength="8" placeholder="CÓDIGO DA SALA">
                    <button id="btnConfirmJoin" class="glow-btn">Entrar</button>
                </div>
            </div>

            <div class="section-box">
                <h3>SALAS PÚBLICAS DISPONÍVEIS</h3>
                <div id="publicRoomsList" class="rooms-list">
                    <p class="no-rooms">Nenhuma sala pública aberta no momento...</p>
                </div>
            </div>

            <div class="error-text" id="uiErrorMessage"></div>
            
            <button id="btnBackFromJoin" class="glow-btn cancel-btn">Voltar ao Menu</button>
        </div>

    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
